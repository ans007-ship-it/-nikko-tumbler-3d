<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIKKO Tumbler 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#eef0ed;font-family:Arial}#info{position:absolute;top:14px;left:16px;background:#ffffffdc;padding:12px 16px;border-radius:12px;color:#26342a;z-index:2}#info b{display:block;margin-bottom:5px}#info small{color:#59665b}canvas{display:block}</style></head><body><div id="info"><b>NIKKO Tumbler · 3D Viewer</b><small>ลากเพื่อหมุน • เลื่อนเพื่อซูม • คลิกขวาเพื่อลาก</small></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef0ed);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(5,5.2,6.2);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x75806f,2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,6,5);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.3);fill.position.set(-4,2,-3);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xe7e9e5,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;scene.add(floor);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.8,0);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=12;
new GLTFLoader().load('./nikko_tumbler_3d.glb',g=>{g.scene.rotation.x=-Math.PI/2;scene.add(g.scene);},undefined,e=>console.error(e));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
