<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NIKKO Tumbler 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9ece8;font-family:Arial,sans-serif}#info{position:absolute;top:14px;left:4%;width:92%;max-width:560px;background:#ffffffdf;padding:14px 18px;border-radius:18px;color:#26342a;z-index:2;box-shadow:0 8px 30px #0001;backdrop-filter:blur(8px)}#info b{font-size:20px}#info small{display:block;margin-top:7px;color:#647064;font-size:13px}#status{font-weight:600}canvas{display:block;touch-action:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="info"><b>NIKKO Tumbler · High Detail 3D</b><small>ลากเพื่อหมุน • ใช้สองนิ้วเพื่อซูม • แตะสองครั้งเพื่อรีเซ็ตมุมมอง</small><small id="status">กำลังโหลดโมเดลรายละเอียดสูง...</small></div><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe9ece8);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(4.8,3.5,5.8);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x778071,2.2));function area(color,intensity,pos){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...pos);scene.add(l)}area(0xffffff,3.2,[4,7,5]);area(0xe4f0ff,2.0,[-5,4,2]);area(0xffffff,2.2,[1,5,-5]);const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xe6e9e4,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.screenSpacePanning=true;controls.minDistance=2.5;controls.maxDistance=12;let initial=null;new GLTFLoader().load('./nikko_tumbler_3d.glb',g=>{const model=g.scene;model.rotation.x=-Math.PI/2;scene.add(model);const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());controls.target.copy(center);const d=Math.max(size.x,size.y,size.z)*2.35;camera.position.set(center.x+d,center.y+d*.65,center.z+d);camera.near=d/1000;camera.far=d*20;camera.updateProjectionMatrix();controls.update();initial={p:camera.position.clone(),t:center.clone()};document.getElementById('status').textContent='โหลดโมเดลสำเร็จ • รายละเอียดวัสดุและฝาปรับปรุงแล้ว';},undefined,e=>{console.error(e);document.getElementById('status').textContent='โหลดโมเดลไม่สำเร็จ: ตรวจสอบไฟล์ GLB'});renderer.domElement.addEventListener('dblclick',()=>{if(initial){camera.position.copy(initial.p);controls.target.copy(initial.t);controls.update()}});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();</script></body></html>
