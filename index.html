
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIKKO Tumbler 3D</title>

<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eef0ed;
  font-family:Arial,sans-serif;
}
#info {
  position:absolute;
  top:20px;
  left:4%;
  z-index:2;
  background:#ffffffdd;
  padding:16px;
  border-radius:18px;
  color:#26342a;
  width:84%;
}
#info b {font-size:22px}
#info small {
  display:block;
  margin-top:10px;
  font-size:15px;
}
canvas {
  display:block;
  width:100%;
  height:100%;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="info">
  <b>NIKKO Tumbler · 3D Viewer</b>
  <small>ลากเพื่อหมุน • เลื่อนเพื่อซูม • ใช้สองนิ้วเพื่อขยาย</small>
  <small id="status">กำลังโหลดโมเดล...</small>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0ed);

const camera = new THREE.PerspectiveCamera(
  40, innerWidth / innerHeight, 0.01, 1000
);
camera.position.set(4, 3, 5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

const light = new THREE.DirectionalLight(0xffffff,3);
light.position.set(5,8,6);
scene.add(light);

const fill = new THREE.DirectionalLight(0xffffff,2);
fill.position.set(-5,4,-5);
scene.add(fill);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

const loader = new GLTFLoader();

loader.load(
  './nikko_tumbler_3d.glb',
  (gltf) => {
    const model = gltf.scene;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    model.position.sub(center);

    const maxDim = Math.max(size.x,size.y,size.z);
    const distance = maxDim * 2.5;

    camera.position.set(distance,distance*0.7,distance);
    camera.near = maxDim / 1000;
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();

    controls.target.set(0,0,0);
    controls.minDistance = maxDim * 0.8;
    controls.maxDistance = maxDim * 8;
    controls.update();

    document.getElementById('status').textContent =
      'โหลดโมเดลสำเร็จ';
  },
  undefined,
  (error) => {
    console.error(error);
    document.getElementById('status').textContent =
      'โหลดโมเดลไม่สำเร็จ กรุณาตรวจสอบไฟล์ GLB';
  }
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
